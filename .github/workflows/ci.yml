name: CI

on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Test-only values. Real secrets never appear in a workflow file.
      JWT_SECRET: ci_only_0123456789abcdef0123456789abcdef0123456789abcdef
      HEALTH_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Install the solver
        run: |
          python -m pip install --upgrade pip
          pip install -r services/scheduler/requirements.txt

      # Fails the build if anyone imports the health client outside the one
      # module permitted to, or reads the constraint store from a module that
      # must stay blind to it.
      - name: Lint, including the privacy boundary rules
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Prepare the database
        run: npm run db:reset

      - name: Unit and privacy tests
        run: npm test

      - name: Build the front end
        run: npm -w @humainity/web run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
